name: ML Scraper

on:
  # Cron horário. 1 termo por run (anti-bot ML detecta padrão se múltiplos).
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      termo:
        description: 'Termo específico (vazio = rotação automática)'
        required: false
        type: string
      modelo:
        description: 'Modelo (C10, C14, etc)'
        required: false
        type: string

# Evita 2 runs simultâneos pisando no mesmo cache
concurrency:
  group: ml-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        working-directory: scripts
        run: |
          npm init -y > /dev/null
          npm install --silent playwright playwright-extra puppeteer-extra-plugin-stealth @neondatabase/serverless

      - name: Install Chromium
        working-directory: scripts
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_TERMO: ${{ inputs.termo }}
          ML_MODELO: ${{ inputs.modelo }}
        run: node scrape-ml.js

      - name: Upload debug artifacts (em caso de bloqueio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-debug-${{ github.run_id }}
          path: |
            scripts/ml-block-*.html
            scripts/ml-block-*.png
          if-no-files-found: ignore
          retention-days: 7
